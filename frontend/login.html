<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — GlobeTrotter Yaoundé</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-root"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="kicker">Bon retour</div>
    <h2>Connexion</h2>
    <div id="err" class="form-error"></div>
    <form id="login-form">
      <div class="field"><label>Email</label><input type="email" id="email" required autocomplete="email"></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary btn-block" type="submit">Se connecter</button>
    </form>
    <p class="form-note">Pas encore de compte ? <a href="register.html" style="color:var(--green);font-weight:700;">Créer un compte</a></p>
  </div>
</div>

<div id="footer-root"></div>
<script src="js/app.js"></script>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errEl = document.getElementById("err");
  errEl.style.display = "none";
  try {
    const { token, user } = await api("/api/login", {
      method: "POST",
      body: JSON.stringify({ email: document.getElementById("email").value, password: document.getElementById("password").value }),
    });
    Store.setToken(token);
    Store.setUser(user);
    toast("Bienvenue, " + user.name.split(" ")[0] + " !");
    setTimeout(() => (location.href = "index.html"), 400);
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = "block";
  }
});
</script>
</body>
</html>
