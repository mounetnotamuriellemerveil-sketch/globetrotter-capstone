<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Créer un compte — GlobeTrotter Yaoundé</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-root"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="kicker">Rejoignez GlobeTrotter</div>
    <h2>Créer un compte</h2>
    <div id="err" class="form-error"></div>
    <form id="register-form">
      <div class="field"><label>Nom complet</label><input type="text" id="name" required autocomplete="name"></div>
      <div class="field"><label>Email</label><input type="email" id="email" required autocomplete="email"></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="password" required minlength="6" autocomplete="new-password"></div>
      <div class="field">
        <label>Centres d'intérêt (optionnel — affine vos recommandations)</label>
        <div id="pref-chips" class="chip-row"></div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Créer mon compte</button>
    </form>
    <p class="form-note">Déjà inscrit(e) ? <a href="login.html" style="color:var(--green);font-weight:700;">Se connecter</a></p>
  </div>
</div>

<div id="footer-root"></div>
<script src="js/app.js"></script>
<script>
const PREF_TAGS = ["histoire", "culture", "nature", "gastronomie", "shopping", "detente", "vue", "famille"];
document.getElementById("pref-chips").innerHTML = PREF_TAGS.map((t) => `<button type="button" class="chip" data-tag="${t}">${t}</button>`).join("");
const selected = new Set();
document.querySelectorAll("[data-tag]").forEach((btn) => {
  btn.addEventListener("click", () => {
    btn.classList.toggle("active");
    selected.has(btn.dataset.tag) ? selected.delete(btn.dataset.tag) : selected.add(btn.dataset.tag);
  });
});

document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errEl = document.getElementById("err");
  errEl.style.display = "none";
  try {
    const { token, user } = await api("/api/register", {
      method: "POST",
      body: JSON.stringify({
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        preferences: Array.from(selected),
      }),
    });
    Store.setToken(token);
    Store.setUser(user);
    toast("Compte créé — bienvenue " + user.name.split(" ")[0] + " !");
    setTimeout(() => (location.href = "index.html"), 400);
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = "block";
  }
});
</script>
</body>
</html>
