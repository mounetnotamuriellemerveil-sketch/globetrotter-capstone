<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lieu — GlobeTrotter Yaoundé</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
</head>
<body>
<div id="nav-root"></div>

<div class="container" style="padding-top:28px;" id="place-root">
  <div class="spinner" style="margin:80px auto;"></div>
</div>

<div id="footer-root"></div>
<script src="js/app.js"></script>
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="js/map.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
let currentPlace = null;

async function load() {
  try {
    const { place, reviews } = await api(`/api/places/${id}`);
    currentPlace = place;
    render(place, reviews);
    initMap(place);
  } catch (e) {
    document.getElementById("place-root").innerHTML = `<div class="empty-state">Lieu introuvable.</div>`;
  }
}

function render(p, reviews) {
  const meta = categoryMeta(p.category);
  document.title = p.name + " — GlobeTrotter Yaoundé";
  document.getElementById("place-root").innerHTML = `
    <div class="detail-hero"><img src="${placeImage(p, 1200, 500)}" alt="${p.name}"></div>
    <div class="detail-grid">
      <div>
        <div class="section-head" style="margin-top:24px;">
          <div>
            <div class="kicker">${meta.icon} ${meta.label} · ${p.quartier}</div>
            <h2>${p.name}</h2>
            <div class="meta" style="display:flex;gap:10px;align-items:center;">
              <span class="rating">${stars(p.rating)}</span><span>${p.rating.toFixed(1)} / 5</span><span>· ${reviews.length} avis</span>
            </div>
          </div>
          <div style="display:flex;gap:8px;">
            <button id="fav-btn" class="btn btn-ghost">🤍 Favori</button>
            <button id="trip-btn" class="btn btn-primary">+ Ajouter au voyage</button>
          </div>
        </div>
        <p style="font-size:1.02rem;">${p.description}</p>
        <div class="pill-row">${p.tags.map((t) => `<span class="pill">#${t}</span>`).join("")}
          ${priceDots(p.price_level)}
        </div>

        <div class="info-card" style="margin-top:26px;">
          <h3 style="font-size:1.1rem;">Avis des voyageurs</h3>
          <div id="reviews">${reviews.length ? reviews.map(reviewHtml).join("") : `<p>Aucun avis pour le moment. Soyez le premier à partager votre expérience.</p>`}</div>
          <div id="review-form-wrap" style="margin-top:16px;"></div>
        </div>
      </div>

      <div class="info-card">
        <h3 style="font-size:1.05rem;">Itinéraire depuis votre position</h3>
        <p style="font-size:.86rem;">Autorisez la géolocalisation pour tracer le trajet routier jusqu'à ce lieu (données OpenStreetMap / OSRM).</p>
        <button id="route-btn" class="btn btn-accent btn-block">📍 Me guider jusqu'ici</button>
        <div id="route-info" style="font-size:.86rem;margin-top:10px;"></div>
        <div id="route-map" class="route-map"></div>
      </div>
    </div>`;

  document.getElementById("fav-btn").addEventListener("click", addFav);
  document.getElementById("trip-btn").addEventListener("click", addToTrip);
  document.getElementById("route-btn").addEventListener("click", goRoute);
  renderReviewForm();
}

function reviewHtml(r) {
  return `<div class="review"><div class="who">${r.author}</div><div class="stars">${stars(r.rating)}</div><p style="margin:6px 0 0;">${r.comment || ""}</p></div>`;
}

function renderReviewForm() {
  const wrap = document.getElementById("review-form-wrap");
  if (!Store.getToken()) {
    wrap.innerHTML = `<p class="hint" style="font-size:.85rem;"><a href="login.html" style="color:var(--green);font-weight:700;">Connectez-vous</a> pour laisser un avis.</p>`;
    return;
  }
  wrap.innerHTML = `
    <form id="review-form">
      <div class="field">
        <label>Votre note</label>
        <select id="rv-rating"><option value="5">★★★★★ Excellent</option><option value="4">★★★★☆ Très bien</option><option value="3">★★★☆☆ Correct</option><option value="2">★★☆☆☆ Moyen</option><option value="1">★☆☆☆☆ Décevant</option></select>
      </div>
      <div class="field"><label>Commentaire</label><textarea id="rv-comment" placeholder="Partagez votre expérience..."></textarea></div>
      <button class="btn btn-primary" type="submit">Publier l'avis</button>
    </form>`;
  document.getElementById("review-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await api(`/api/places/${id}/reviews`, {
        method: "POST",
        body: JSON.stringify({ rating: Number(document.getElementById("rv-rating").value), comment: document.getElementById("rv-comment").value }),
      });
      toast("Merci pour votre avis !");
      load();
    } catch (err) { toast(err.message); }
  });
}

async function addFav() {
  if (!Store.getToken()) { toast("Connectez-vous pour enregistrer un favori"); return; }
  try { await api(`/api/favorites/${id}`, { method: "POST" }); document.getElementById("fav-btn").textContent = "❤️ Dans vos favoris"; toast("Ajouté aux favoris"); }
  catch (err) { toast(err.message); }
}

function addToTrip() {
  if (!Store.getToken()) { toast("Connectez-vous pour créer un voyage"); return; }
  const draft = JSON.parse(localStorage.getItem("gt_trip_draft") || "[]");
  if (!draft.includes(Number(id))) draft.push(Number(id));
  localStorage.setItem("gt_trip_draft", JSON.stringify(draft));
  toast("Ajouté à votre brouillon de voyage");
}

let routeMap;
function initMap(p) {
  routeMap = makeMap("route-map", { center: [p.lng, p.lat], zoom: 13.5, pitch: 45 });
  routeMap.on("load", () => addPlaceMarkers(routeMap, [p]));
}

async function goRoute() {
  const btn = document.getElementById("route-btn");
  const infoEl = document.getElementById("route-info");
  btn.disabled = true;
  btn.textContent = "Localisation en cours...";
  const from = await getVisitorLocation();
  if (!from) {
    infoEl.innerHTML = `Position indisponible — autorisez la géolocalisation du navigateur, ou utilisez un point de départ approximatif (centre-ville de Yaoundé).`;
    btn.disabled = false; btn.textContent = "📍 Me guider jusqu'ici";
    return;
  }
  try {
    btn.textContent = "Calcul de l'itinéraire...";
    const { distanceKm, durationMin } = await drawRoute(routeMap, from, [currentPlace.lng, currentPlace.lat]);
    infoEl.innerHTML = `<strong>${distanceKm.toFixed(1)} km</strong> · environ <strong>${Math.round(durationMin)} min</strong> en voiture jusqu'à ${currentPlace.name}.`;
  } catch (e) {
    infoEl.textContent = e.message;
  }
  btn.disabled = false; btn.textContent = "📍 Recalculer l'itinéraire";
}

load();
</script>
</body>
</html>
