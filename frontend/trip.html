<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon voyage — GlobeTrotter Yaoundé</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-root"></div>

<div class="container" style="padding-top:32px;">
  <div class="section-head">
    <div>
      <div class="kicker" data-i18n="trip_kicker"></div>
      <h2 data-i18n="trip_title"></h2>
    </div>
  </div>

  <div id="gate"></div>

  <div id="planner" style="display:none;">
    <div class="detail-grid" style="grid-template-columns:1fr 1.2fr;">
      <div class="info-card">
        <h3 style="font-size:1.05rem;" data-i18n="trip_new"></h3>
        <form id="trip-form">
          <div class="field"><label data-i18n="trip_name"></label><input type="text" id="t-name" data-i18n-ph="trip_name_ph" required></div>
          <div class="field" style="display:flex;gap:10px;">
            <div style="flex:1;"><label data-i18n="trip_start"></label><input type="date" id="t-start"></div>
            <div style="flex:1;"><label data-i18n="trip_end"></label><input type="date" id="t-end"></div>
          </div>
          <div class="field">
            <label><span data-i18n="trip_places"></span> (<span id="sel-count">0</span> <span data-i18n="trip_selected"></span>)</label>
            <div id="picker" class="picker-grid"><div class="spinner"></div></div>
          </div>
          <button class="btn btn-primary btn-block" type="submit" data-i18n="trip_create"></button>
        </form>
      </div>
      <div>
        <h3 style="font-size:1.05rem;" data-i18n="trip_yours"></h3>
        <div id="trips-list"><p class="hint" style="color:var(--muted);" data-i18n="trip_none"></p></div>
      </div>
    </div>
  </div>
</div>

<div id="footer-root"></div>
<script src="js/app.js"></script>
<script>
let allPlaces = [];
let picked = new Set(JSON.parse(localStorage.getItem("gt_trip_draft") || "[]"));
const lang = Store.getLang();

function renderGate() {
  const gate = document.getElementById("gate");
  if (Store.getToken()) {
    gate.innerHTML = "";
    document.getElementById("planner").style.display = "block";
    boot();
  } else {
    gate.innerHTML = `
      <div class="empty-state" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);">
        ${t("gate_msg")}<br><br>
        <a href="login.html" class="btn btn-primary">${t("nav_login")}</a>
        <a href="register.html" class="btn btn-ghost">${t("nav_register")}</a>
      </div>`;
  }
}

async function boot() {
  const { places } = await api("/api/places");
  allPlaces = places;
  renderPicker();
  loadTrips();
}

function renderPicker() {
  document.getElementById("picker").innerHTML = allPlaces.map((p) => {
    const meta = categoryMeta(p.category);
    return `<div class="picker-item ${picked.has(p.id) ? "selected" : ""}" data-id="${p.id}">${meta.icon} ${p.name}</div>`;
  }).join("");
  document.querySelectorAll(".picker-item").forEach((el) => {
    el.addEventListener("click", () => {
      const id = Number(el.dataset.id);
      picked.has(id) ? picked.delete(id) : picked.add(id);
      el.classList.toggle("selected");
      document.getElementById("sel-count").textContent = picked.size;
      localStorage.setItem("gt_trip_draft", JSON.stringify(Array.from(picked)));
    });
  });
  document.getElementById("sel-count").textContent = picked.size;
}

async function loadTrips() {
  const { itineraries } = await api("/api/itineraries");
  const list = document.getElementById("trips-list");
  if (!itineraries.length) {
    list.innerHTML = `<p class="hint" style="color:var(--muted);">${t("trip_none")}</p>`;
    return;
  }
  list.innerHTML = itineraries.map(tripHtml).join("");
  itineraries.forEach((tr) => {
    document.getElementById("del-" + tr.id)?.addEventListener("click", () => deleteTrip(tr.id));
    document.getElementById("share-" + tr.id)?.addEventListener("click", () => shareTrip(tr));
  });
}

function tripHtml(tr) {
  const names = tr.place_ids.map((id) => allPlaces.find((p) => p.id === id)).filter(Boolean);
  const dates = tr.start_date && tr.end_date ? `${tr.start_date} → ${tr.end_date}` : t("trip_dates_tbd");
  return `
  <div class="trip-card">
    <div class="trip-head">
      <div><h3 style="margin:0;">${tr.name}</h3><span class="hint" style="color:var(--muted);font-size:.85rem;">${dates}</span></div>
      <span class="budget-badge">${tr.estimated_budget_fcfa.toLocaleString(lang === "en" ? "en-US" : "fr-FR")} FCFA</span>
    </div>
    <div class="trip-places">${names.map((p) => `<span class="pill">${categoryMeta(p.category).icon} ${p.name}</span>`).join("") || `<span class="hint"></span>`}</div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button id="share-${tr.id}" class="btn btn-ghost btn-sm">${t("trip_share")}</button>
      <button id="del-${tr.id}" class="btn btn-danger btn-sm">${t("trip_delete")}</button>
    </div>
  </div>`;
}

async function deleteTrip(id) {
  await api(`/api/itineraries/${id}`, { method: "DELETE" });
  toast(lang === "en" ? "Itinerary deleted" : "Itinéraire supprimé");
  loadTrips();
}

function shareTrip(tr) {
  const url = `${location.origin}/api/share/${tr.share_code}`;
  navigator.clipboard?.writeText(url);
  toast(lang === "en" ? "Share link copied!" : "Lien de partage copié !");
}

document.getElementById("trip-form")?.addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await api("/api/itineraries", {
      method: "POST",
      body: JSON.stringify({
        name: document.getElementById("t-name").value,
        start_date: document.getElementById("t-start").value || null,
        end_date: document.getElementById("t-end").value || null,
        place_ids: Array.from(picked),
      }),
    });
    toast(lang === "en" ? "Itinerary created!" : "Itinéraire créé !");
    document.getElementById("t-name").value = "";
    picked.clear();
    localStorage.removeItem("gt_trip_draft");
    renderPicker();
    loadTrips();
  } catch (err) { toast(err.message); }
});

renderGate();
</script>
</body>
</html>
