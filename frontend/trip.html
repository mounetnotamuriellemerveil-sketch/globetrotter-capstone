<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon voyage — GlobeTrotter Yaoundé</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-root"></div>

<div class="container" style="padding-top:32px;">
  <div class="section-head">
    <div>
      <div class="kicker">Planificateur</div>
      <h2>Mon voyage à Yaoundé</h2>
    </div>
  </div>

  <div id="gate"></div>

  <div id="planner" style="display:none;">
    <div class="detail-grid" style="grid-template-columns:1fr 1.2fr;">
      <div class="info-card">
        <h3 style="font-size:1.05rem;">Nouvel itinéraire</h3>
        <form id="trip-form">
          <div class="field"><label>Nom du voyage</label><input type="text" id="t-name" placeholder="Ex : Week-end à Yaoundé" required></div>
          <div class="field" style="display:flex;gap:10px;">
            <div style="flex:1;"><label>Arrivée</label><input type="date" id="t-start"></div>
            <div style="flex:1;"><label>Départ</label><input type="date" id="t-end"></div>
          </div>
          <div class="field">
            <label>Lieux à visiter (<span id="sel-count">0</span> sélectionné(s))</label>
            <div id="picker" class="picker-grid"><div class="spinner"></div></div>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Créer l'itinéraire</button>
        </form>
      </div>
      <div>
        <h3 style="font-size:1.05rem;">Vos itinéraires</h3>
        <div id="trips-list"><p class="hint" style="color:var(--muted);">Aucun itinéraire pour l'instant.</p></div>
      </div>
    </div>
  </div>
</div>

<div id="footer-root"></div>
<script src="js/app.js"></script>
<script>
let allPlaces = [];
let picked = new Set(JSON.parse(localStorage.getItem("gt_trip_draft") || "[]"));

function renderGate() {
  const gate = document.getElementById("gate");
  if (Store.getToken()) {
    gate.innerHTML = "";
    document.getElementById("planner").style.display = "block";
    boot();
  } else {
    gate.innerHTML = `
      <div class="empty-state" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);">
        Connectez-vous pour créer et sauvegarder votre itinéraire.<br><br>
        <a href="login.html" class="btn btn-primary">Se connecter</a>
        <a href="register.html" class="btn btn-ghost">Créer un compte</a>
      </div>`;
  }
}

async function boot() {
  const { places } = await api("/api/places");
  allPlaces = places;
  renderPicker();
  loadTrips();
}

function renderPicker() {
  document.getElementById("picker").innerHTML = allPlaces.map((p) => {
    const meta = categoryMeta(p.category);
    return `<div class="picker-item ${picked.has(p.id) ? "selected" : ""}" data-id="${p.id}">${meta.icon} ${p.name}</div>`;
  }).join("");
  document.querySelectorAll(".picker-item").forEach((el) => {
    el.addEventListener("click", () => {
      const id = Number(el.dataset.id);
      picked.has(id) ? picked.delete(id) : picked.add(id);
      el.classList.toggle("selected");
      document.getElementById("sel-count").textContent = picked.size;
      localStorage.setItem("gt_trip_draft", JSON.stringify(Array.from(picked)));
    });
  });
  document.getElementById("sel-count").textContent = picked.size;
}

async function loadTrips() {
  const { itineraries } = await api("/api/itineraries");
  const list = document.getElementById("trips-list");
  if (!itineraries.length) {
    list.innerHTML = `<p class="hint" style="color:var(--muted);">Aucun itinéraire pour l'instant — créez votre premier voyage à gauche.</p>`;
    return;
  }
  list.innerHTML = itineraries.map(tripHtml).join("");
  itineraries.forEach((t) => {
    document.getElementById("del-" + t.id)?.addEventListener("click", () => deleteTrip(t.id));
    document.getElementById("share-" + t.id)?.addEventListener("click", () => shareTrip(t));
  });
}

function tripHtml(t) {
  const names = t.place_ids.map((id) => allPlaces.find((p) => p.id === id)).filter(Boolean);
  const dates = t.start_date && t.end_date ? `${t.start_date} → ${t.end_date}` : "Dates à définir";
  return `
  <div class="trip-card">
    <div class="trip-head">
      <div><h3 style="margin:0;">${t.name}</h3><span class="hint" style="color:var(--muted);font-size:.85rem;">${dates}</span></div>
      <span class="budget-badge">${t.estimated_budget_fcfa.toLocaleString("fr-FR")} FCFA</span>
    </div>
    <div class="trip-places">${names.map((p) => `<span class="pill">${categoryMeta(p.category).icon} ${p.name}</span>`).join("") || `<span class="hint">Aucun lieu ajouté.</span>`}</div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button id="share-${t.id}" class="btn btn-ghost btn-sm">🔗 Partager</button>
      <button id="del-${t.id}" class="btn btn-danger btn-sm">Supprimer</button>
    </div>
  </div>`;
}

async function deleteTrip(id) {
  await api(`/api/itineraries/${id}`, { method: "DELETE" });
  toast("Itinéraire supprimé");
  loadTrips();
}

function shareTrip(t) {
  const url = `${location.origin}/api/share/${t.share_code}`;
  navigator.clipboard?.writeText(url);
  toast("Lien de partage copié !");
}

document.getElementById("trip-form")?.addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await api("/api/itineraries", {
      method: "POST",
      body: JSON.stringify({
        name: document.getElementById("t-name").value,
        start_date: document.getElementById("t-start").value || null,
        end_date: document.getElementById("t-end").value || null,
        place_ids: Array.from(picked),
      }),
    });
    toast("Itinéraire créé !");
    document.getElementById("t-name").value = "";
    picked.clear();
    localStorage.removeItem("gt_trip_draft");
    renderPicker();
    loadTrips();
  } catch (err) { toast(err.message); }
});

renderGate();
</script>
</body>
</html>
